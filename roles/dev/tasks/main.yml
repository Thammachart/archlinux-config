---
- name: Install Tools
  become: true
  package:
    name:
      - docker
      - docker-compose
      - podman
      - distrobox
      - gcc
      - rustup
      - python
      - python-pip
    state: present
- name: Enable docker.socket
  become: true
  systemd:
    name: docker.socket
    state: started
    enabled: true
    masked: false
