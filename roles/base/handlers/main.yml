- name: Restart {{ ntp_client_systemd_service }}
  become: true
  systemd:
    name: "{{ ntp_client_systemd_service }}"
    state: restarted
  when: not ansible_facts['is_chroot']

- name: Rebuild mkinitcpio
  become: true
  command: mkinitcpio -p {{ kernel_used }}
  register: mkinitcpio_output
  changed_when: mkinitcpio_output.rc == 0
