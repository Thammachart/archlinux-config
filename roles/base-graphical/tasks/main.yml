      - papirus-icon-theme
      - pop-gtk-theme
      - qt5-wayland
      - qt6-wayland
      - qt6ct
      - kvantum
      - lxqt-archiver
      - lximage-qt
      - qt6-imageformats
      - kimageformats
      - qalculate-gtk
