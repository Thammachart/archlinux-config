---
- name: Install GUI-related components (pacman)
  become: true
  package:
    name:
      # - firefox
      # - chromium
      - mpv
      - lxqt-policykit
      - pcmanfm-qt
      - nautilus
      - papers
      - mesa
      - libva-mesa-driver
      - libva-utils
      - vulkan-icd-loader
      - vulkan-validation-layers
      - vulkan-radeon
      - nwg-bar
      - nwg-look
      - sway
      - swaybg
      - swayidle
      - swaylock
      - waybar
      - niri
      - dms-shell-niri
      - matugen
      - mako
      - grim
      - slurp
      - wl-clipboard
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-wlr
      - xdg-user-dirs
      - ghostty
      - xorg-xwayland
      - fuzzel
      - wlsunset
      - shikane
      - pipewire
      - pipewire-pulse
      - pipewire-jack
      - pavucontrol
      - pamixer
      - geany
      - zed
      - featherpad
      # - code
      - libnotify
      - keepassxc
      - pop-gtk-theme
      - papirus-icon-theme
      - pop-gtk-theme
      - qt5-wayland
      - qt6-wayland
      - qt6ct
      - kvantum
      - lxqt-archiver
      - lximage-qt
      - qt6-imageformats
      - kimageformats
      - qalculate-gtk
      - udisks2
      - gnome-disk-utility
      # - udiskie
      - cage
      - greetd
      - greetd-regreet
      - wlr-randr
    state: present

- name: Install GUI-related components (AUR)
  kewlfft.aur.aur:
    name:
      # - fonts-tlwg
      - ttf-google-sans-code-vf
      - brave-bin
      - vscodium-bin
    state: present

- import_tasks: _setup_network.yml
- import_tasks: _setup_bluetooth.yml

- include_tasks: _setup_secret_pam.yml
  loop:
    - { module: "pam_gnome_keyring.so", pam_name: "login" }
    - { module: "pam_gnome_keyring.so", pam_name: "greetd" }
  loop_control:
    loop_var: it

- import_tasks: _setup_fontconfig.yml

- import_tasks: _setup_u2f_pam.yml

- import_tasks: _setup_display_managers.yml

- name: udisks2 Mount Options
  become: true
  community.general.ini_file:
    path: "{{ udisk_mount_options_path }}"
    mode: "0644"
    section: defaults
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    state: present
  loop: "{{ fs | dict2items }}"
  vars:
    fs:
      ext4_allow: errors=remount-ro,commit
      ext4_defaults: "noatime,commit=30"
      btrfs_defaults: "noatime,compress=zstd:1"
      ntfs_defaults: "uid=$UID,gid=$GID,noatime,prealloc"
