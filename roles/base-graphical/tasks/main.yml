      - vulkan-validation-layers
      - vulkan-radeon
      - nwg-bar
      - nwg-look
      - sway
      - swaybg
      - swayidle
      - swaylock
      - waybar
      - niri
      - dms-shell-niri
      - matugen
      - mako
      - grim
      - slurp
