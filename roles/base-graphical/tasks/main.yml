      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-wlr
      - xdg-user-dirs
      - ghostty
      - xorg-xwayland
      - fuzzel
      - wlsunset
      - shikane
      - pipewire
      - pipewire-pulse
      - pipewire-jack
      - pavucontrol
      - pamixer
      - geany
      - zed
      - featherpad
      # - code
      - libnotify
      - keepassxc
